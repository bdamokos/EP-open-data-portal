<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="robots" content="noindex, nofollow, noarchive"/><meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f5f1"/><meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141618"/><meta name="color-scheme" content="light dark"/><script src="./assets/colour-scheme.js" vite-ignore></script><link rel="icon" href="./assets/favicon.svg"/><meta name="description" content="Explore MEPs, parliamentary questions and plenary activity using public European Parliament data."/><title>European Parliament data explorer</title>
<style>
/* Keep the first document useful before application scripts or styles arrive. */
#initial-shell { position:fixed; inset:0; overflow:auto; color-scheme:light dark; color:light-dark(#1c1f23,#ecebe6); background:light-dark(#f6f5f1,#141618); font:18px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
:root[data-theme=light] #initial-shell { color-scheme:light; }
:root[data-theme=dark] #initial-shell { color-scheme:dark; }
#initial-shell * { box-sizing:border-box; }
#initial-shell header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px 20px; padding:12px clamp(16px,2.5vw,40px); border-bottom:1px solid light-dark(#dcd8cf,#363b41); font-size:15px; }
#initial-shell header strong { font-size:17px; }
#initial-shell nav { display:flex; flex-wrap:wrap; gap:2px; }
#initial-shell a { display:block; min-height:44px; padding:10px 12px; color:inherit; text-decoration:none; }
#initial-shell a:hover { text-decoration:underline; }
#initial-shell a[aria-current=page] { box-shadow:inset 0 -3px light-dark(#0b5f69,#6cc7cf); font-weight:600; }
#initial-shell a:focus-visible { outline:3px solid light-dark(#0b5f69,#6cc7cf); outline-offset:2px; }
#initial-shell section { padding:36px clamp(18px,4vw,64px); }
#initial-shell h1 { max-width:1050px; margin:12px 0 18px; font:600 clamp(32px,4vw,58px)/1.06 Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif; letter-spacing:-.025em; }
#initial-shell p { color:light-dark(#595e65,#a9aeb4); }
@media(max-width:767px) {
  #initial-shell header { gap:6px 8px; padding:10px 16px 0; font-size:13px; }
  #initial-shell header strong { font-size:14px; }
  #initial-shell nav { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); width:100%; }
  #initial-shell a { min-width:0; padding:8px 4px; text-align:center; }
  #initial-shell section { padding-top:20px; }
}
</style>
<script src="./assets/initial-shell.js" defer vite-ignore></script>
</head><body><div id="root">
<main id="initial-shell" lang="en">
  <header>
    <strong>European Parliament data explorer</strong>
    <nav aria-label="Explore Parliament">
      <a href="?" data-view="members">Members</a>
      <a href="?view=legislation" data-view="legislation">Plenary agenda</a>
      <a href="?view=questions" data-view="questions">Questions</a>
      <a href="?view=outside" data-view="outside">Outside voices</a>
      <a href="?view=groups" data-view="groups">Group voices</a>
      <a href="?view=saved" data-view="saved">Following</a>
    </nav>
  </header>
  <section aria-busy="true">
    <h1>European Parliament data explorer</h1>
    <p role="status">Loading view…</p>
    <noscript>JavaScript is required to open this view.</noscript>
  </section>
</main>
</div><script type="module" src="/src/initialShell.ts"></script><script type="module" src="/src/main.tsx"></script></body></html>
