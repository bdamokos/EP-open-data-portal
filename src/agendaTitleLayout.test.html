<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda title layout regression</title>
  <link rel="stylesheet" href="./base.css">
  <link rel="stylesheet" href="./Insights.css">
  <link rel="stylesheet" href="./ExplorerLayout.css">
</head>
<body>
  <main class="explorer-insights">
    <h1>Plenary agenda</h1>
    <div class="insight-agenda-view" data-topic-selected="false">
    <div class="insight-agenda-navigation"><button>Back to agenda</button><label class="insight-agenda-select">Agenda item<select><option>Cohesion policy – the driving force in implementing the EU agenda for cities</option></select></label></div>
    <div class="insight-legislation-grid">
      <aside class="insight-agenda" aria-label="Sitting agenda">
        <div>
          <h3>First sitting</h3>
          <button><small>Vote</small><strong>Transport: enforcement of passenger rights in the Union</strong></button>
          <button><small>Vote</small><strong>Protection of adults: jurisdiction, applicable law, recognition and enforcement of measures and cooperation</strong></button>
          <button><small>Vote</small><strong>Cohesion policy – the driving force in implementing the EU agenda for cities</strong></button>
          <button><small>Vote</small><strong>Combating VAT fraud – the effectiveness of cross-border cooperation when it comes to VAT fraud and its impact on the EU budget</strong></button>
        </div>
        <div>
          <h3>Second sitting</h3>
          <button><small>Debate</small><strong>Implementation of the European Union strategy for sustainable and inclusive regional development and strengthening cooperation across borders</strong></button>
          <button><small>Debate</small><strong>InterinstitutionalAgreementOnCrossBorderCooperationAndImplementationOfEuropeanUnionPolicy</strong></button>
        </div>
      </aside>
      <section class="insight-topic-detail"><h2>Choose an agenda item</h2></section>
    </div>
    </div>
  </main>
</body>
</html>
