name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
        env:
          ACTIVITY_INDEX_ENABLED: 'false'
      - run: npm run check
      - run: npm run build

  runtime-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --build-arg APP_REVISION="$GITHUB_SHA" --tag parliament-explorer:ci .
      - run: node scripts/check-runtime-image.mjs parliament-explorer:ci "$GITHUB_SHA"

  read-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      report: ${{ steps.report.outputs.report }}
      has_findings: ${{ steps.report.outputs.has_findings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Compare with the first parent for both PR merge commits and main pushes.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build pinned SQLite CLI (3.45.1)
        uses: ./.github/actions/sqlite-cli
      - name: Identify benchmark content and toolchains
        id: identity
        env:
          READ_BENCHMARK_PR: ${{ github.event.pull_request.number }}
        run: node scripts/read-benchmark-cache.mjs --identity HEAD^1
      # PR runs never save main keys, so a base can only come from main scope.
      - name: Restore base result
        id: base-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/read-benchmark-cache/result.json
          key: ${{ steps.identity.outputs.base_key }}
      # Use the identical cache path on both sides: actions/cache also hashes paths.
      - name: Stage restored base
        id: restored-base
        run: |
          node scripts/read-benchmark-cache.mjs --stage "$RUNNER_TEMP/read-benchmark-cache/result.json" "$RUNNER_TEMP/read-benchmark-base-result.json"
          rm -rf "$RUNNER_TEMP/read-benchmark-cache"
      - name: Restore head result from main
        id: head-main-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/read-benchmark-cache/result.json
          key: ${{ steps.identity.outputs.head_main_key }}
      - name: Restore PR head result
        id: head-pr-cache
        if: github.event_name == 'pull_request' && steps.head-main-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/read-benchmark-cache/result.json
          key: ${{ steps.identity.outputs.head_pr_key }}
      - name: Stage restored head
        id: restored-head
        run: node scripts/read-benchmark-cache.mjs --stage "$RUNNER_TEMP/read-benchmark-cache/result.json" "$RUNNER_TEMP/read-benchmark-result.json"
      - name: Compare base and head reads
        id: compare
        env:
          BASE_REF: ${{ steps.identity.outputs.base }}
          BASE_CACHED: ${{ steps.restored-base.outputs.valid == 'true' }}
          HEAD_CACHED: ${{ steps.restored-head.outputs.valid == 'true' }}
          TMPDIR: ${{ runner.temp }}
        run: |
          args=(--compare "$BASE_REF")
          if [ "$BASE_CACHED" = true ]; then args+=(--cached-base "$RUNNER_TEMP/read-benchmark-base-result.json"); fi
          if [ "$HEAD_CACHED" = true ]; then args+=(--cached-head "$RUNNER_TEMP/read-benchmark-result.json"); fi
          npm run bench:reads -- "${args[@]}"
      - name: Stage base for cache
        id: stage-base-cache
        if: ${{ !cancelled() && steps.compare.outcome != 'skipped' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: node scripts/read-benchmark-cache.mjs --stage "$RUNNER_TEMP/read-benchmark-base-result.json" "$RUNNER_TEMP/read-benchmark-cache/result.json"
      - name: Save measured base on main
        if: ${{ !cancelled() && steps.stage-base-cache.outputs.valid == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.base-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/read-benchmark-cache/result.json
          key: ${{ steps.identity.outputs.base_key }}
      - name: Stage head for cache
        id: stage-head-cache
        if: ${{ !cancelled() && steps.compare.outcome != 'skipped' }}
        run: node scripts/read-benchmark-cache.mjs --stage "$RUNNER_TEMP/read-benchmark-result.json" "$RUNNER_TEMP/read-benchmark-cache/result.json"
      - name: Save measured head
        if: ${{ !cancelled() && steps.stage-head-cache.outputs.valid == 'true' && steps.head-main-cache.outputs.cache-hit != 'true' && steps.head-pr-cache.outputs.cache-hit != 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/read-benchmark-cache/result.json
          key: ${{ github.event_name == 'pull_request' && steps.identity.outputs.head_pr_key || steps.identity.outputs.head_main_key }}
      - name: Render benchmark report
        id: report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/read-benchmark-report.mjs \
            --before "$RUNNER_TEMP/read-benchmark-base-result.json" --before-label main \
            --after "$RUNNER_TEMP/read-benchmark-result.json" --after-label PR \
            --before-source "${{ steps.restored-base.outputs.valid == 'true' && 'restored from cache' || 'measured' }}" \
            --after-source "${{ steps.restored-head.outputs.valid == 'true' && 'restored from cache' || 'measured' }}" \
            --run-url "$RUN_URL" > "$RUNNER_TEMP/report.md"
          delimiter="report_$(openssl rand -hex 16)"
          { echo "report<<$delimiter"; cat "$RUNNER_TEMP/report.md"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

  # Posts from a separate job so pull request code never runs with a write token.
  read-benchmark-comment:
    needs: read-benchmarks
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && (needs.read-benchmarks.outputs.has_findings == 'true'
      || needs.read-benchmarks.outputs.has_findings == 'false')
      && needs.read-benchmarks.outputs.report != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the benchmark comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          REPORT: ${{ needs.read-benchmarks.outputs.report }}
          HAS_FINDINGS: ${{ needs.read-benchmarks.outputs.has_findings }}
        run: |
          current=$(gh api "repos/$REPO/pulls/$PR" --jq '[.state, .head.sha] | join(" ")')
          if [ "$current" != "open $EXPECTED_HEAD" ]; then exit 0; fi
          printf '%s\n' "$REPORT" > "$RUNNER_TEMP/report.md"
          marker='<!-- read-benchmark-report -->'
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | tail -n 1)
          if [ "$HAS_FINDINGS" = false ]; then
            if [ -n "$id" ]; then
              gh api --method DELETE "repos/$REPO/issues/comments/$id" > /dev/null
            fi
          elif [ "$HAS_FINDINGS" = true ] && [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F "body=@$RUNNER_TEMP/report.md" > /dev/null
          elif [ "$HAS_FINDINGS" = true ]; then
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F "body=@$RUNNER_TEMP/report.md" > /dev/null
          fi

  translation-coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      report: ${{ steps.report.outputs.report }}
      has_findings: ${{ steps.report.outputs.has_findings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Report missing translations and potential wording drift
        id: report
        continue-on-error: true
        env:
          TRANSLATION_BASE: ${{ github.event.pull_request.base.sha }}
          TRANSLATION_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/translation-coverage-report.mjs
      - name: Report advisory failure
        if: ${{ !cancelled() && steps.report.outcome != 'success' }}
        run: |
          echo '::warning::Translation comparison unavailable; inspect the PR catalogues manually.'
          echo 'Translation comparison unavailable. No coverage conclusion was produced; inspect the exact PR base/head catalogues manually.' >> "$GITHUB_STEP_SUMMARY"

  # No checkout or PR code execution in this job: report text is data only.
  translation-coverage-comment:
    needs: translation-coverage
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && (needs.translation-coverage.outputs.has_findings == 'true'
      || needs.translation-coverage.outputs.has_findings == 'false')
      && needs.translation-coverage.outputs.report != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    permissions:
      pull-requests: write
    steps:
      - name: Update the translation advisory comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          REPORT: ${{ needs.translation-coverage.outputs.report }}
          HAS_FINDINGS: ${{ needs.translation-coverage.outputs.has_findings }}
        run: |
          node --input-type=module <<'JS'
          const {GH_TOKEN, REPO, PR, EXPECTED_HEAD, REPORT, HAS_FINDINGS} = process.env;
          const marker = '<!-- translation-coverage-report -->';
          async function api(path, method = 'GET', body) {
            const response = await fetch(`https://api.github.com/repos/${REPO}/${path}`, {
              method, headers: {authorization: `Bearer ${GH_TOKEN}`, accept: 'application/vnd.github+json', 'content-type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'},
              body: body === undefined ? undefined : JSON.stringify(body), signal: AbortSignal.timeout(10000),
            });
            if (!response.ok) throw new Error('Comment API unavailable');
            if (response.status === 204) return;
            return response.json();
          }
          try {
            if (!['true', 'false'].includes(HAS_FINDINGS)) process.exit(0);
            if (!REPORT.startsWith(marker) || Buffer.byteLength(REPORT, 'utf8') > 48000) throw new Error('Invalid report');
            const pr = await api(`pulls/${PR}`);
            if (pr.state !== 'open' || pr.head.sha !== EXPECTED_HEAD) process.exit(0);
            let existing;
            for (let page = 1; page <= 20; page++) {
              const comments = await api(`issues/${PR}/comments?per_page=100&page=${page}`);
              existing ??= comments.find(comment => comment.user?.login === 'github-actions[bot]' && comment.user?.type === 'Bot' && comment.body?.startsWith(marker));
              if (existing || comments.length < 100) break;
              if (page === 20) throw new Error('Comment pagination limit');
            }
            if (HAS_FINDINGS === 'false') {
              if (existing) await api(`issues/comments/${existing.id}`, 'DELETE');
            } else {
              await api(existing ? `issues/comments/${existing.id}` : `issues/${PR}/comments`, existing ? 'PATCH' : 'POST', {body: REPORT});
            }
          } catch {
            console.log('::warning::Translation advisory comment unavailable; see the translation-coverage job summary.');
          }
          JS
