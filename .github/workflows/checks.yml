name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run api:check
        env:
          API_VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm test
        env:
          ACTIVITY_INDEX_ENABLED: 'false'
      - run: npm run check
      - run: npm run build

  runtime-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --build-arg APP_REVISION="$GITHUB_SHA" --tag parliament-explorer:ci .
      - run: node scripts/check-runtime-image.mjs parliament-explorer:ci "$GITHUB_SHA"
