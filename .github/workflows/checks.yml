name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run api:check
        env:
          API_VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          API_VERSION_MAIN_BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.sha || 'origin/main' }}
      - run: npm test
        env:
          ACTIVITY_INDEX_ENABLED: 'false'
      - run: npm run check
      - run: npm run build

  runtime-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --build-arg APP_REVISION="$GITHUB_SHA" --tag parliament-explorer:ci .
      - run: node scripts/check-runtime-image.mjs parliament-explorer:ci "$GITHUB_SHA"

  read-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build pinned SQLite CLI (3.45.1)
        run: |
          curl --fail --location https://www.sqlite.org/2024/sqlite-autoconf-3450100.tar.gz -o "$RUNNER_TEMP/sqlite.tar.gz"
          echo "cd9c27841b7a5932c9897651e20b86c701dd740556989b01ca596fcfa3d49a0a  $RUNNER_TEMP/sqlite.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/sqlite.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/read-benchmark-bin"
          cc -O2 -DSQLITE_ENABLE_FTS5 "$RUNNER_TEMP/sqlite-autoconf-3450100/shell.c" "$RUNNER_TEMP/sqlite-autoconf-3450100/sqlite3.c" -lm -ldl -lpthread -o "$RUNNER_TEMP/read-benchmark-bin/sqlite3"
          echo "$RUNNER_TEMP/read-benchmark-bin" >> "$GITHUB_PATH"
      - run: npm run bench:reads
